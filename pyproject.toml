[project]
name = "memory-cmic"
version = "0.1.0"
description = "Unified memory service data-model validation"
requires-python = ">=3.11,<4.0"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "openai>=1.70,<3.0",
    "pgvector>=0.3,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "mcp>=1.19,<2",
    "uvicorn>=0.34,<1.0",
]

[project.scripts]
memory-cmic-api = "memory_cmic.server:main"
memory-cmic-worker = "memory_cmic.worker:main"

[tool.poetry]
packages = [
    { include = "memory_cmic", from = "src" },
    { include = "migration_tools", from = "src" },
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
